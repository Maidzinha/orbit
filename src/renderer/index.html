<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
  <title>Orbit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="petals" aria-hidden="true"></div>

  <aside id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="brand-logo" aria-hidden="true">
        <defs>
          <linearGradient id="g-planet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" class="stop-a" />
            <stop offset="1" class="stop-b" />
          </linearGradient>
        </defs>
        <g transform="rotate(-22 24 24)">
          <path d="M4 24 A20 7 0 0 1 44 24" fill="none" class="logo-ring" stroke-width="3" />
          <circle cx="24" cy="24" r="11" fill="url(#g-planet)" />
          <path d="M44 24 A20 7 0 0 1 4 24" fill="none" class="logo-ring" stroke-width="3" />
        </g>
        <circle cx="40" cy="9" r="3" class="logo-moon" />
      </svg>
      <div>
        <div class="brand-name">Orbit <span class="heart">♡</span></div>
        <div class="brand-tag" data-i18n="tagline"></div>
      </div>
    </div>

    <nav id="nav">
      <button data-view="today" class="active"><span class="ico">☀</span><span data-i18n="navToday"></span></button>
      <button data-view="week"><span class="ico">✦</span><span data-i18n="navWeek"></span></button>
      <button data-view="month"><span class="ico">☾</span><span data-i18n="navMonth"></span></button>
      <button data-view="settings"><span class="ico">⚙</span><span data-i18n="navSettings"></span></button>
    </nav>

    <div class="mascot-card">
      <div class="bubble" id="bubble"></div>
      <div class="mascot" id="mascot"></div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text"></span></div>
    </div>
  </aside>

  <main id="content"></main>

  <script src="../shared/stats.js"></script>
  <script src="i18n.js"></script>
  <script src="mascot.js"></script>
  <script src="app.js"></script>
</body>
</html>
